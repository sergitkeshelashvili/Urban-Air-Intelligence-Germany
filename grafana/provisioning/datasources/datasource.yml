apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: TimescaleDB
    type: postgres
    access: proxy
    # Use the Compose service name so Grafana can resolve the database on
    # the project network, regardless of the container_name setting.
    url: timescaledb:5432
    user: uba_user
    secureJsonData:
      password: uba_password
    jsonData:
      database: uba_air_quality
      sslmode: 'disable'
      postgresVersion: 1500
      timescaledb: true
    isDefault: true
    editable: true
